<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>PreConnect PDF Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: transparent;
      --text: #112134;
      --muted: #5f728a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: transparent;
        --text: #f4f7fb;
        --muted: #9aabbe;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .shell {
      min-height: 100vh;
      padding: 0 0 24px;
    }

    #viewer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 0 24px;
    }

    .page-wrap {
      padding: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.16);
    }

    .empty {
      min-height: 50vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="viewer">
      <div class="empty" id="emptyState">Preparing grade sheet viewer...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const channel = window.PdfViewerChannel;
    const viewerElement = document.getElementById('viewer');
    const emptyStateElement = document.getElementById('emptyState');
    const pendingChunks = [];

    let currentScale = 1.2;
    let currentPdf = null;

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function postMessage(message) {
      if (channel && typeof channel.postMessage === 'function') {
        channel.postMessage(message);
      }
    }

    function clearViewer() {
      viewerElement.innerHTML = '';
    }

    async function renderCurrentPdf() {
      if (!currentPdf) return;
      clearViewer();
      for (let pageNumber = 1; pageNumber <= currentPdf.numPages; pageNumber += 1) {
        const page = await currentPdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: currentScale });
        const wrap = document.createElement('div');
        wrap.className = 'page-wrap';
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const context = canvas.getContext('2d', { alpha: false });
        await page.render({ canvasContext: context, viewport }).promise;
        wrap.appendChild(canvas);
        viewerElement.appendChild(wrap);
      }
      postMessage('rendered');
    }

    window.startPdfTransfer = function() {
      pendingChunks.length = 0;
    };

    window.appendPdfChunk = function(chunk) {
      pendingChunks.push(chunk);
    };

    window.finishPdfTransfer = async function() {
      try {
        if (!window.pdfjsLib) {
          throw new Error('PDF.js failed to load');
        }
        const base64 = pendingChunks.join('');
        pendingChunks.length = 0;
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        const documentTask = window.pdfjsLib.getDocument({ data: bytes });
        currentPdf = await documentTask.promise;
        if (emptyStateElement) {
          emptyStateElement.remove();
        }
        await renderCurrentPdf();
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        clearViewer();
        viewerElement.innerHTML =
          `<div class="empty">Unable to render the PDF in-app.<br>${message}</div>`;
        postMessage(`error:${message}`);
      }
    };
    postMessage('ready');
  </script>
</body>
</html>
