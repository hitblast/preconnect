name: preconnect
description: "Your personalised student portal for BRAC University"
publish_to: 'none'

version: 1.5.2+202603070

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.7
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  webview_flutter_android: 4.10.11
  connectivity_plus: ^7.0.0
  webview_flutter: ^4.13.1
  intl: ^0.20.2
  android_intent_plus: ^6.0.0
  mobile_scanner: ^7.2.0
  archive: ^4.0.9
  flutter_alarmkit: ^0.0.10
  native_file_preview: ^1.0.1
  barcode_widget: ^2.0.4
  flutter_flip_card: ^0.0.6
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  in_app_update: ^4.2.5
  in_app_review: ^2.0.11
  package_info_plus: ^9.0.0
  local_auth: ^3.0.1
  sembast: ^3.8.6
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3
  


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: "assets/logo/preconnect-logo-transparent.png"
  image_dark: "assets/logo/preconnect-logo-transparent.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: "assets/logo/preconnect-logo-transparent.png"
    image_dark: "assets/logo/preconnect-logo-transparent.png"


flutter:
  uses-material-design: true
  assets:
    - assets/logo/preconnect-logo-transparent.png
